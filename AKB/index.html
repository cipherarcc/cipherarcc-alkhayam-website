<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#a8342a">
  <meta
    name="description"
    content="Al Khayam Restaurant — Bakery & Restaurant. Digital menu with WhatsApp ordering."
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Al Khayam">

  <title>Al Khayam Restaurant — Digital Menu</title>

  <style>
    /* ============================================================
       AL KHAYAM RESTAURANT — DIGITAL MENU
       Premium mobile-first design
       ============================================================ */

    /* ============================================================
       01. DESIGN TOKENS
       ============================================================ */

    :root {
      --red: #a8342a;
      --red-dark: #79231d;
      --red-deep: #651c18;
      --red-soft: #f7e6e2;
      --red-glow: rgba(168, 52, 42, 0.24);

      --cream: #f5e8c8;
      --cream-light: #fff8e8;
      --cream-dark: #e8d5a8;

      --bg: #faf6f0;
      --card: #ffffff;
      --text: #2b2b2b;
      --text-light: #4a4a4a;
      --muted: #888888;
      --muted-light: #aaaaaa;

      --border: #eee5d9;
      --border-light: #f6f0e7;

      --success: #25d366;
      --success-dark: #1da851;

      --shadow-sm:
        0 2px 8px rgba(70, 35, 20, 0.05);

      --shadow:
        0 4px 18px rgba(70, 35, 20, 0.07);

      --shadow-md:
        0 8px 28px rgba(70, 35, 20, 0.11);

      --shadow-lg:
        0 14px 40px rgba(70, 35, 20, 0.15);

      --radius-xs: 6px;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --radius-pill: 999px;

      --ease:
        cubic-bezier(0.22, 1, 0.36, 1);

      --ease-fast:
        cubic-bezier(0.4, 0, 0.2, 1);

      --header-height: 0px;

      --fs-xs: 10px;
      --fs-sm: 11px;
      --fs-base: 13px;
      --fs-md: 14px;
      --fs-lg: 16px;
      --fs-xl: 18px;
      --fs-2xl: 22px;
      --fs-3xl: 28px;
    }

    /* ============================================================
       02. DARK MODE
       ============================================================ */

    body.dark-mode {
      --bg: #121212;
      --card: #1d1d1d;

      --text: #f4f4f4;
      --text-light: #d3d3d3;

      --muted: #999999;
      --muted-light: #727272;

      --border: #2e2e2e;
      --border-light: #252525;

      --cream: #3a3028;
      --cream-light: #28231f;
      --cream-dark: #51463a;

      --red-soft: #3a1f1b;

      --shadow-sm:
        0 2px 8px rgba(0, 0, 0, 0.22);

      --shadow:
        0 4px 18px rgba(0, 0, 0, 0.28);

      --shadow-md:
        0 8px 28px rgba(0, 0, 0, 0.38);

      --shadow-lg:
        0 14px 40px rgba(0, 0, 0, 0.5);
    }

    /* ============================================================
       03. RESET
       ============================================================ */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);

      padding-bottom:
        calc(92px + env(safe-area-inset-bottom));

      overflow-x: hidden;

      line-height: 1.5;
      font-size: var(--fs-base);

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

      transition:
        background 0.35s ease,
        color 0.35s ease;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      outline: none;
      background: none;
      color: inherit;
      cursor: pointer;
    }

    input {
      outline: none;
      border: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    ::selection {
      background: var(--red);
      color: #ffffff;
    }

    :focus-visible {
      outline: 3px solid rgba(168, 52, 42, 0.3);
      outline-offset: 2px;
    }

    /* ============================================================
       04. SCROLLBAR
       ============================================================ */

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted-light);
    }

    /* ============================================================
       05. HERO
       ============================================================ */

    .hero {
      position: relative;
      overflow: hidden;

      min-height: 390px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        calc(48px + env(safe-area-inset-top))
        22px
        42px;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(255, 255, 255, 0.15),
          transparent 42%
        ),
        linear-gradient(
          145deg,
          #7b241e 0%,
          #a8342a 48%,
          #8d2a22 100%
        );

      color: #ffffff;
      text-align: center;
    }

    .hero::before {
      content: "";
      position: absolute;

      width: 260px;
      height: 260px;

      top: -130px;
      right: -90px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.07);
    }

    .hero::after {
      content: "";
      position: absolute;

      width: 220px;
      height: 220px;

      bottom: -120px;
      left: -80px;

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.08);
    }

    .hero-content {
      position: relative;
      z-index: 2;

      width: min(100%, 650px);

      animation: heroEnter 0.7s var(--ease);
    }

    @keyframes heroEnter {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;

      padding: 6px 13px;

      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: var(--radius-pill);

      background: rgba(255, 255, 255, 0.1);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 1.5px;
      text-transform: uppercase;

      margin-bottom: 15px;
    }

    .hero h1 {
      font-size: clamp(38px, 11vw, 68px);

      line-height: 0.95;

      font-weight: 900;
      letter-spacing: -2px;
    }

    .hero h1 span {
      color: var(--cream);
    }

    .hero-tagline {
      margin-top: 13px;

      font-size: 13px;
      font-weight: 700;

      letter-spacing: 3px;
      text-transform: uppercase;

      opacity: 0.9;
    }

    .hero-divider {
      width: 42px;
      height: 2px;

      margin: 18px auto;

      background: var(--cream);
      border-radius: 999px;

      opacity: 0.8;
    }

    .hero-intro {
      max-width: 560px;
      margin: 0 auto;

      font-size: 12px;
      line-height: 1.7;

      color: rgba(255, 255, 255, 0.84);
    }

    .hero-actions {
      display: flex;
      justify-content: center;

      gap: 9px;

      margin-top: 22px;
    }

    .hero-btn {
      min-height: 42px;

      padding: 0 16px;

      border-radius: 12px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 7px;

      font-size: 11px;
      font-weight: 800;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .hero-btn svg {
      width: 15px;
      height: 15px;

      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hero-btn:active {
      transform: scale(0.95);
    }

    .hero-btn-primary {
      background: #ffffff;
      color: var(--red);
    }

    .hero-btn-primary:hover {
      background: var(--cream-light);
    }

    .hero-btn-outline {
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.08);

      color: #ffffff;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .hero-btn-outline:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .hero-hours {
      margin-top: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 7px;

      color: rgba(255, 255, 255, 0.75);

      font-size: 10px;
      font-weight: 600;
    }

    .hero-hours svg {
      width: 14px;
      height: 14px;

      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ============================================================
       06. HEADER
       ============================================================ */

    .header {
      position: sticky;
      top: 0;

      z-index: 100;

      background: color-mix(
        in srgb,
        var(--card) 92%,
        transparent
      );

      padding:
        calc(11px + env(safe-area-inset-top))
        16px
        0;

      border-bottom: 1px solid var(--border);

      backdrop-filter: saturate(180%) blur(14px);
      -webkit-backdrop-filter: saturate(180%) blur(14px);

      transition:
        background 0.35s ease,
        border-color 0.35s ease;
    }

    .header-top {
      min-height: 42px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      margin-bottom: 12px;
    }

    /* Brand */

    .brand {
      display: flex;
      align-items: center;

      gap: 10px;

      min-width: 0;

      user-select: none;
    }

    .brand-logo {
      width: 40px;
      height: 40px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background:
        linear-gradient(
          145deg,
          var(--red),
          var(--red-dark)
        );

      color: #ffffff;

      font-size: 12px;
      font-weight: 900;

      letter-spacing: 0.5px;

      box-shadow:
        0 5px 15px var(--red-glow);

      transition:
        transform 0.25s var(--ease);
    }

    .brand:active .brand-logo {
      transform: scale(0.94);
    }

    .brand-text {
      min-width: 0;
    }

    .brand-text h1 {
      color: var(--red);

      font-size: 15px;
      line-height: 1;

      font-weight: 900;

      letter-spacing: 0.4px;
    }

    .brand-text span {
      display: block;

      margin-top: 4px;

      color: var(--muted);

      font-size: 8px;
      line-height: 1;

      font-weight: 700;

      letter-spacing: 1px;
    }

    /* Header actions */

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;

      flex-shrink: 0;
    }

    .icon-btn {
      width: 36px;
      height: 36px;

      display: flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid var(--border);

      border-radius: 50%;

      background: var(--bg);
      color: var(--text);

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .icon-btn:hover {
      background: var(--red-soft);
      border-color: var(--red-soft);
      color: var(--red);
    }

    .icon-btn:active {
      transform: scale(0.88);
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;

      fill: none;
      stroke: currentColor;
      stroke-width: 2;

      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #darkModeBtn svg {
      transition: transform 0.35s var(--ease);
    }

    body.dark-mode #darkModeBtn svg {
      transform: rotate(180deg);
    }

    /* ============================================================
       07. SEARCH
       ============================================================ */

    .search-wrap {
      position: relative;

      padding-bottom: 12px;
    }

    .search-input {
      width: 100%;
      height: 46px;

      padding:
        0
        92px
        0
        42px;

      border:
        1px solid var(--border);

      border-radius: 13px;

      background: var(--bg);
      color: var(--text);

      font-size: 14px;

      transition:
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .search-input::placeholder {
      color: var(--muted);
    }

    .search-input:focus {
      border-color: var(--red);

      background: var(--card);

      box-shadow:
        0 0 0 4px rgba(168, 52, 42, 0.07);
    }

    .search-icon {
      position: absolute;

      left: 14px;
      top: 23px;

      width: 16px;
      height: 16px;

      transform: translateY(-50%);

      pointer-events: none;

      fill: none;
      stroke: var(--muted);
      stroke-width: 2;

      stroke-linecap: round;
      stroke-linejoin: round;

      transition: stroke 0.2s ease;
    }

    .search-input:focus ~ .search-icon {
      stroke: var(--red);
    }

    .clear-search {
      position: absolute;

      right: 8px;
      top: 5px;

      width: 36px;
      height: 36px;

      display: none;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      color: var(--muted);

      font-size: 14px;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .clear-search.show {
      display: flex;
    }

    .clear-search:hover {
      background: var(--red-soft);
      color: var(--red);
    }

    /* ============================================================
       08. CATEGORY NAVIGATION
       ============================================================ */

    .cat-wrap {
      position: sticky;

      top: var(--header-height);

      z-index: 90;

      background:
        color-mix(
          in srgb,
          var(--card) 95%,
          transparent
        );

      border-bottom:
        1px solid var(--border);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      transition:
        background 0.35s ease,
        border-color 0.35s ease;
    }

    .cat-scroll {
      display: flex;

      gap: 8px;

      padding:
        11px 16px;

      overflow-x: auto;

      scrollbar-width: none;
      -ms-overflow-style: none;

      -webkit-overflow-scrolling: touch;

      scroll-snap-type: x proximity;
    }

    .cat-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      flex-shrink: 0;

      min-height: 36px;

      padding:
        0
        15px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid var(--border);

      border-radius: var(--radius-pill);

      background: var(--bg);

      color: var(--muted);

      font-size: 12px;
      font-weight: 700;

      white-space: nowrap;

      scroll-snap-align: start;

      transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease,
        transform 0.2s ease;
    }

    .cat-pill:hover {
      color: var(--red);
      border-color: var(--red);
    }

    .cat-pill.active {
      background: var(--red);
      color: #ffffff;
      border-color: var(--red);

      box-shadow:
        0 5px 14px var(--red-glow);
    }

    .cat-pill:active {
      transform: scale(0.94);
    }

    /* ============================================================
       09. MENU
       ============================================================ */

    .menu-container {
      width: 100%;
      max-width: 1080px;

      margin: 0 auto;

      animation:
        menuEnter 0.45s var(--ease);
    }

    @keyframes menuEnter {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .menu-section {
      content-visibility: auto;
      contain-intrinsic-size: 400px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      padding:
        23px 16px 12px;
    }

    .section-title-text {
      display: flex;
      align-items: center;

      gap: 8px;

      min-width: 0;
    }

    .section-title-dot {
      width: 7px;
      height: 7px;

      flex-shrink: 0;

      border-radius: 50%;

      background: var(--red);

      box-shadow:
        0 0 0 4px var(--red-soft);
    }

    .section-title h2 {
      font-size: 19px;
      line-height: 1.2;

      font-weight: 850;

      letter-spacing: -0.35px;
    }

    .section-count {
      flex-shrink: 0;

      padding: 4px 9px;

      border-radius: var(--radius-pill);

      background: var(--cream);

      color: var(--red);

      font-size: 10px;
      font-weight: 800;
    }

    body.dark-mode .section-count {
      background: var(--red-soft);
    }

    /* Product grid */

    .product-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 11px;

      padding:
        0 16px 20px;
    }

    /* ============================================================
       10. PRODUCT CARD
       ============================================================ */

    .product-card {
      position: relative;

      display: flex;
      flex-direction: column;

      min-width: 0;

      overflow: hidden;

      background: var(--card);

      border:
        1px solid rgba(168, 52, 42, 0.045);

      border-radius: var(--radius-lg);

      box-shadow: var(--shadow);

      animation:
        cardAppear 0.45s var(--ease) backwards;

      transition:
        transform 0.25s var(--ease),
        box-shadow 0.25s var(--ease),
        border-color 0.25s ease;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .product-card:active {
      transform: scale(0.985);
    }

    body.dark-mode .product-card {
      border-color:
        rgba(255, 255, 255, 0.05);
    }

    /* Product image */

    .product-image {
      position: relative;

      width: 100%;

      aspect-ratio: 1 / 0.92;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #f5e8c8,
          #faf0d7
        );
    }

    body.dark-mode .product-image {
      background:
        linear-gradient(
          135deg,
          #2a2420,
          #3a3028
        );
    }

    .product-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      transition:
        transform 0.45s var(--ease);
    }

    .product-card:hover
    .product-image img {
      transform: scale(1.045);
    }

    .product-image .placeholder {
      padding: 15px;

      color: #c5b291;

      font-size: 9px;
      font-weight: 800;

      letter-spacing: 1.4px;

      text-align: center;

      text-transform: uppercase;
    }

    /* Product body */

    .product-body {
      flex: 1;

      display: flex;
      flex-direction: column;

      padding:
        10px 11px 11px;
    }

    .product-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      gap: 6px;

      margin-bottom: 5px;
    }

    .product-name {
      flex: 1;

      min-width: 0;

      color: var(--text);

      font-size: 13px;
      line-height: 1.25;

      font-weight: 800;

      word-break: break-word;
    }

    .product-price {
      flex-shrink: 0;

      color: var(--red);

      font-size: 12.5px;
      line-height: 1.25;

      font-weight: 900;

      text-align: right;
      white-space: nowrap;
    }

    .product-desc {
      flex: 1;

      min-height: 28px;

      margin-bottom: 9px;

      color: var(--muted);

      font-size: 10px;
      line-height: 1.4;

      display: -webkit-box;

      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    /* Size selector */

    .size-label {
      margin-bottom: 5px;

      color: var(--text);

      font-size: 9.5px;
      font-weight: 800;

      letter-spacing: 0.2px;
    }

    .size-pills {
      display: flex;

      gap: 5px;

      margin-bottom: 9px;

      overflow-x: auto;

      scrollbar-width: none;
    }

    .size-pills::-webkit-scrollbar {
      display: none;
    }

    .size-pill {
      flex-shrink: 0;

      min-height: 27px;

      padding:
        0 10px;

      border:
        1px solid var(--border);

      border-radius: var(--radius-pill);

      background: var(--cream-light);

      color: var(--muted);

      font-size: 9.5px;
      font-weight: 800;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
    }

    .size-pill:hover {
      color: var(--red);
      border-color: var(--red);
    }

    .size-pill.active {
      background: var(--red);
      color: #ffffff;
      border-color: var(--red);

      box-shadow:
        0 3px 8px var(--red-glow);
    }

    .size-pill:active {
      transform: scale(0.92);
    }

    .product-card.single-price
    .size-label,
    .product-card.single-price
    .size-pills {
      display: none;
    }

    /* Card actions */

    .card-actions {
      display: flex;
      align-items: center;

      gap: 6px;

      margin-top: auto;
    }

    .qty-mini {
      display: flex;
      align-items: center;

      gap: 1px;

      padding: 2px;

      border-radius: var(--radius-pill);

      background: var(--cream-light);
    }

    .qty-mini button {
      width: 27px;
      height: 27px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: var(--red);

      font-size: 14px;
      font-weight: 900;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .qty-mini button:hover {
      background: var(--red);
      color: #ffffff;
    }

    .qty-mini button:active {
      transform: scale(0.88);
    }

    .qty-mini span {
      min-width: 17px;

      color: var(--red);

      font-size: 10px;
      font-weight: 900;

      text-align: center;
    }

    .add-btn {
      flex: 1;

      min-width: 0;
      height: 31px;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          var(--red),
          var(--red-dark)
        );

      color: #ffffff;

      font-size: 10px;
      font-weight: 900;

      letter-spacing: 0.3px;
      text-transform: uppercase;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .add-btn:hover {
      box-shadow:
        0 5px 13px var(--red-glow);
    }

    .add-btn:active {
      transform: scale(0.95);
    }

    .add-btn:disabled {
      background: var(--border);
      color: var(--muted);
      cursor: not-allowed;

      box-shadow: none;
    }

    /* Market price */

    .market-price {
      color: var(--red);
      font-weight: 900;
    }

    /* ============================================================
       11. EMPTY STATE
       ============================================================ */

    .empty-state {
      padding:
        70px 22px;

      text-align: center;

      color: var(--muted);
    }

    .empty-state-icon {
      margin-bottom: 13px;

      font-size: 38px;

      opacity: 0.4;
    }

    .empty-state-text {
      margin-bottom: 5px;

      font-size: 14px;
      font-weight: 800;
    }

    .empty-state-subtext {
      font-size: 11px;
      color: var(--muted-light);
    }

    /* ============================================================
       12. CART BAR
       ============================================================ */

    .cart-bar {
      position: fixed;

      left: 50%;

      bottom:
        calc(11px + env(safe-area-inset-bottom));

      width:
        min(
          900px,
          calc(100% - 24px)
        );

      min-height: 61px;

      transform: translateX(-50%);

      z-index: 200;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        0 17px;

      border-radius: var(--radius-lg);

      background:
        linear-gradient(
          135deg,
          var(--red),
          var(--red-dark)
        );

      color: #ffffff;

      box-shadow:
        0 12px 32px var(--red-glow);

      cursor: pointer;

      transition:
        transform 0.25s var(--ease),
        box-shadow 0.25s ease;
    }

    .cart-bar:active {
      transform:
        translateX(-50%)
        scale(0.985);
    }

    .cart-bar-left {
      display: flex;
      align-items: center;

      gap: 11px;

      min-width: 0;
    }

    .cart-icon-badge {
      position: relative;

      width: 28px;
      height: 28px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-icon-badge svg {
      width: 22px;
      height: 22px;

      fill: none;
      stroke: #ffffff;
      stroke-width: 2;

      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cart-count {
      position: absolute;

      top: -6px;
      right: -7px;

      min-width: 20px;
      height: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 5px;

      border-radius: 999px;

      background: #ffffff;
      color: var(--red);

      font-size: 9px;
      font-weight: 900;

      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.16);
    }

    .cart-count.bump {
      animation:
        countBump 0.4s var(--ease);
    }

    @keyframes countBump {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.3);
      }

      100% {
        transform: scale(1);
      }
    }

    .cart-text {
      min-width: 0;
    }

    .cart-text strong {
      display: block;

      font-size: 13px;
      line-height: 1.2;

      font-weight: 900;
    }

    .cart-text span {
      display: block;

      margin-top: 2px;

      font-size: 10px;

      opacity: 0.82;

      white-space: nowrap;
    }

    .cart-total {
      flex-shrink: 0;

      margin-left: 12px;

      font-size: 15px;
      font-weight: 900;

      white-space: nowrap;
    }

    /* ============================================================
       13. OVERLAY
       ============================================================ */

    .overlay {
      position: fixed;
      inset: 0;

      z-index: 300;

      background:
        rgba(0, 0, 0, 0.5);

      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
    }

    /* ============================================================
       14. CART DRAWER
       ============================================================ */

    .cart-drawer {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 400;

      max-height: 90vh;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      background: var(--card);

      color: var(--text);

      border-radius:
        var(--radius-xl)
        var(--radius-xl)
        0
        0;

      transform: translateY(100%);

      transition:
        transform 0.4s var(--ease);

      box-shadow:
        0 -10px 50px rgba(0, 0, 0, 0.15);
    }

    .cart-drawer.show {
      transform: translateY(0);
    }

    .drawer-handle {
      width: 42px;
      height: 5px;

      flex-shrink: 0;

      margin:
        10px auto 4px;

      border-radius: 999px;

      background: var(--border);
    }

    .drawer-header {
      min-height: 54px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        7px 20px 10px;

      border-bottom:
        1px solid var(--border);
    }

    .drawer-header h2 {
      font-size: 18px;
      font-weight: 900;
    }

    .close-btn {
      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: var(--red-soft);
      color: var(--red);

      font-size: 15px;
      font-weight: 800;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .close-btn:hover {
      background: var(--red);
      color: #ffffff;
    }

    .close-btn:active {
      transform: rotate(90deg) scale(0.9);
    }

    /* ============================================================
       15. ORDER TYPE
       ============================================================ */

    .order-tabs {
      display: flex;

      gap: 3px;

      margin:
        13px 20px 0;

      padding: 4px;

      border-radius: 13px;

      background: var(--cream-light);
    }

    .order-tab {
      flex: 1;

      min-height: 58px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 4px;

      border-radius: 9px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 800;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .order-tab svg {
      width: 16px;
      height: 16px;

      fill: none;
      stroke: currentColor;
      stroke-width: 2;

      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .order-tab.active {
      background: var(--card);
      color: var(--red);

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .order-tab:active {
      transform: scale(0.97);
    }

    /* ============================================================
       16. DRAWER ITEMS
       ============================================================ */

    .drawer-items {
      flex: 1;

      overflow-y: auto;

      padding:
        10px 20px 12px;

      -webkit-overflow-scrolling: touch;
    }

    .drawer-item {
      display: flex;
      align-items: center;

      gap: 11px;

      padding:
        11px 0;

      border-bottom:
        1px solid var(--border);

      animation:
        drawerItemIn 0.25s var(--ease) backwards;
    }

    .drawer-item:last-child {
      border-bottom: 0;
    }

    @keyframes drawerItemIn {
      from {
        opacity: 0;
        transform: translateX(-8px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .drawer-item-img {
      width: 52px;
      height: 52px;

      flex-shrink: 0;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background: var(--cream-light);
    }

    .drawer-item-img img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .drawer-item-img .placeholder {
      color: #c3b28e;

      font-size: 8px;
      font-weight: 800;

      letter-spacing: 0.5px;
    }

    .drawer-item-info {
      flex: 1;
      min-width: 0;
    }

    .drawer-item-name {
      margin-bottom: 3px;

      font-size: 12.5px;
      line-height: 1.3;

      font-weight: 800;

      word-break: break-word;
    }

    .drawer-item-price {
      color: var(--red);

      font-size: 10.5px;
      font-weight: 800;
    }

    .drawer-qty {
      display: flex;
      align-items: center;

      gap: 7px;

      flex-shrink: 0;
    }

    .drawer-qty button {
      width: 28px;
      height: 28px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: var(--red-soft);
      color: var(--red);

      font-size: 15px;
      font-weight: 900;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .drawer-qty button:hover {
      background: var(--red);
      color: #ffffff;
    }

    .drawer-qty button:active {
      transform: scale(0.9);
    }

    .drawer-qty span {
      min-width: 16px;

      color: var(--red);

      font-size: 12px;
      font-weight: 900;

      text-align: center;
    }

    /* ============================================================
       17. DRAWER FOOTER
       ============================================================ */

    .drawer-footer {
      flex-shrink: 0;

      padding:
        12px 20px
        calc(14px + env(safe-area-inset-bottom));

      border-top:
        1px solid var(--border);

      background: var(--card);
    }

    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 4px 0;

      color: var(--muted);

      font-size: 11px;
    }

    .summary-row.total {
      margin-top: 6px;
      padding-top: 10px;

      border-top:
        1px dashed var(--border);

      color: var(--text);

      font-size: 17px;
      font-weight: 900;
    }

    .summary-row.total span:last-child {
      color: var(--red);
    }

    .order-btn {
      width: 100%;
      min-height: 50px;

      margin-top: 11px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          var(--success),
          #20bd5b
        );

      color: #ffffff;

      font-size: 13px;
      font-weight: 900;

      box-shadow:
        0 7px 18px rgba(37, 211, 102, 0.27);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .order-btn:hover {
      background:
        linear-gradient(
          135deg,
          #27d96c,
          var(--success-dark)
        );

      box-shadow:
        0 9px 22px rgba(37, 211, 102, 0.35);
    }

    .order-btn:active {
      transform: scale(0.97);
    }

    .order-btn svg {
      width: 18px;
      height: 18px;

      fill: currentColor;
      stroke: none;
    }

    /* ============================================================
       18. TOAST
       ============================================================ */

    .toast-container {
      position: fixed;

      left: 50%;

      bottom:
        calc(
          84px +
          env(safe-area-inset-bottom)
        );

      z-index: 2000;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 8px;

      transform: translateX(-50%);

      pointer-events: none;
    }

    .toast {
      max-width:
        calc(100vw - 32px);

      padding:
        10px 17px;

      border-radius: 999px;

      background: #292929;
      color: #ffffff;

      font-size: 11.5px;
      font-weight: 700;

      white-space: nowrap;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.25);

      animation:
        toastIn 0.35s var(--ease);
    }

    .toast.out {
      animation:
        toastOut 0.3s var(--ease) forwards;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform:
          translateY(15px)
          scale(0.94);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    @keyframes toastOut {
      from {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }

      to {
        opacity: 0;
        transform:
          translateY(12px)
          scale(0.94);
      }
    }

    /* ============================================================
       19. BACK TO TOP
       ============================================================ */

    .back-to-top {
      position: fixed;

      right: 15px;

      bottom:
        calc(
          84px +
          env(safe-area-inset-bottom)
        );

      z-index: 180;

      width: 40px;
      height: 40px;

      display: flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid var(--border);

      border-radius: 50%;

      background: var(--card);
      color: var(--red);

      box-shadow: var(--shadow-md);

      opacity: 0;
      visibility: hidden;

      transform: translateY(8px);

      transition:
        opacity 0.25s ease,
        visibility 0.25s ease,
        transform 0.25s ease,
        background 0.25s ease;
    }

    .back-to-top.show {
      opacity: 1;
      visibility: visible;

      transform: translateY(0);
    }

    .back-to-top:hover {
      background: var(--red);
      color: #ffffff;
    }

    .back-to-top svg {
      width: 18px;
      height: 18px;

      fill: none;
      stroke: currentColor;
      stroke-width: 2;

      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ============================================================
       20. LOADING / SKELETON
       ============================================================ */

    .skeleton {
      background:
        linear-gradient(
          90deg,
          var(--border) 25%,
          var(--border-light) 50%,
          var(--border) 75%
        );

      background-size: 200% 100%;

      animation:
        skeleton 1.5s ease-in-out infinite;

      border-radius: var(--radius-md);
    }

    @keyframes skeleton {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    /* ============================================================
       21. DESKTOP / TABLET
       ============================================================ */

    @media (min-width: 600px) {
      .hero {
        min-height: 430px;
      }

      .hero-intro {
        font-size: 13px;
      }

      .product-grid {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));

        gap: 14px;
      }

      .section-title {
        padding-left: 20px;
        padding-right: 20px;
      }

      .product-grid {
        padding-left: 20px;
        padding-right: 20px;
      }

      .product-name {
        font-size: 13.5px;
      }
    }

    @media (min-width: 900px) {
      .header {
        padding-left: 24px;
        padding-right: 24px;
      }

      .cat-scroll {
        padding-left: 24px;
        padding-right: 24px;
      }

      .product-grid {
        grid-template-columns:
          repeat(4, minmax(0, 1fr));

        gap: 16px;
      }

      .menu-container {
        max-width: 1080px;
      }

      .cart-drawer {
        left: 50%;
        right: auto;
        bottom: 20px;

        width: min(560px, calc(100% - 40px));

        max-height: 88vh;

        border-radius: var(--radius-xl);

        transform:
          translate(-50%, calc(100% + 40px));
      }

      .cart-drawer.show {
        transform:
          translate(-50%, 0);
      }

      .drawer-footer {
        border-radius:
          0 0
          var(--radius-xl)
          var(--radius-xl);
      }
    }

    @media (min-width: 1200px) {
      .hero-intro {
        font-size: 13.5px;
      }

      .product-grid {
        gap: 18px;
      }

      .product-body {
        padding:
          12px 13px 13px;
      }

      .product-name {
        font-size: 14px;
      }
    }

    /* ============================================================
       22. SMALL MOBILE DEVICES
       ============================================================ */

    @media (max-width: 360px) {
      .header {
        padding-left: 12px;
        padding-right: 12px;
      }

      .brand-text h1 {
        font-size: 14px;
      }

      .brand-logo {
        width: 37px;
        height: 37px;
      }

      .icon-btn {
        width: 34px;
        height: 34px;
      }

      .product-grid {
        gap: 8px;
        padding-left: 11px;
        padding-right: 11px;
      }

      .section-title {
        padding-left: 11px;
        padding-right: 11px;
      }

      .product-body {
        padding:
          9px 9px 10px;
      }

      .product-name {
        font-size: 12px;
      }

      .product-price {
        font-size: 11px;
      }

      .cart-bar {
        width:
          calc(100% - 18px);

        padding:
          0 14px;
      }
    }

    /* ============================================================
       23. REDUCED MOTION
       ============================================================ */

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

            ></path>
          </svg>
        </a>

      </div>

    </div>


    <!-- Search -->

    <div class="search-wrap">

      <svg
        class="search-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="8"></circle>
        <line
          x1="21"
          y1="21"
          x2="16.65"
          y2="16.65"
        ></line>
      </svg>


      <input
        type="search"
        class="search-input"
        id="searchInput"
        placeholder="Search for a dish..."
        aria-label="Search menu"
        autocomplete="off"
        enterkeyhint="search"
      >


      <button
        class="clear-search"
        id="clearSearch"
        type="button"
        onclick="clearSearch()"
        aria-label="Clear search"
        title="Clear search"
      >
        &#10005;
      </button>

    </div>

  </header>


  <!-- ==========================================================
       CATEGORIES
       ========================================================== -->

  <nav
    class="cat-wrap"
    aria-label="Menu categories"
  >
    <div
      class="cat-scroll"
      id="catScroll"
      role="tablist"
      aria-label="Menu categories"
    ></div>
  </nav>


  <!-- ==========================================================
       MENU
       ========================================================== -->

  <main
    class="menu-container"
    id="menuContainer"
    aria-live="polite"
  ></main>


  <!-- ==========================================================
       CART BAR
       ========================================================== -->

  <button
    class="cart-bar"
    id="cartBar"
    type="button"
    onclick="openCart()"
    aria-label="Open your order"
  >

    <div class="cart-bar-left">

      <div class="cart-icon-badge">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>

          <path
            d="M1 1h4l2.68 13.39
            a2 2 0 0 0 2 1.61h9.72
            a2 2 0 0 0 2-1.61L23 6H6"
          ></path>
        </svg>

        <span
          class="cart-count"
          id="cartCount"
        >
          0
        </span>

      </div>


      <div class="cart-text">

        <strong>
          View Order
        </strong>

        <span id="cartItemsText">
          0 items
        </span>

      </div>

    </div>


    <div
      class="cart-total"
      id="cartTotal"
    >
      AED 0
    </div>

  </button>


  <!-- ==========================================================
       OVERLAY
       ========================================================== -->

  <div
    class="overlay"
    id="overlay"
    onclick="closeCart()"
    aria-hidden="true"
  ></div>


  <!-- ==========================================================
       CART DRAWER
       ========================================================== -->

  <aside
    class="cart-drawer"
    id="cartDrawer"
    aria-label="Your order"
    aria-hidden="true"
  >

    <div class="drawer-handle"></div>


    <div class="drawer-header">

      <h2>
        Your Order
      </h2>

      <button
        class="close-btn"
        type="button"
        onclick="closeCart()"
        aria-label="Close cart"
      >
        &#10005;
      </button>

    </div>


    <!-- Order type -->

    <div
      class="order-tabs"
      id="orderTabs"
      role="tablist"
      aria-label="Order type"
    >

      <button
        class="order-tab"
        type="button"
        data-type="delivery"
        role="tab"
        aria-selected="false"
      >

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect
            x="1"
            y="3"
            width="15"
            height="13"
          ></rect>

          <polygon
            points="16 8 20 8 23 11 23 16 16 16 16 8"
          ></polygon>

          <circle
            cx="5.5"
            cy="18.5"
            r="2.5"
          ></circle>

          <circle
            cx="18.5"
            cy="18.5"
            r="2.5"
          ></circle>
        </svg>

        Delivery

      </button>


      <button
        class="order-tab active"
        type="button"
        data-type="dinein"
        role="tab"
        aria-selected="true"
      >

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M3 2v7c0 1.1.9 2 2 2h4
            a2 2 0 0 0 2-2V2"
          ></path>

          <path d="M7 2v20"></path>

          <path
            d="M21 15V2
            a5 5 0 0 0-5 5v6
            c0 1.1.9 2 2 2h3zm0 0v7"
          ></path>
        </svg>

        Dine in

      </button>


      <button
        class="order-tab"
        type="button"
        data-type="takeaway"
        role="tab"
        aria-selected="false"
      >

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M6 2L3 6v14
            a2 2 0 0 0 2 2h14
            a2 2 0 0 0 2-2V6l-3-4z"
          ></path>

          <line
            x1="3"
            y1="6"
            x2="21"
            y2="6"
          ></line>

          <path
            d="M16 10a4 4 0 0 1-8 0"
          ></path>
        </svg>

        Takeaway

      </button>

    </div>


    <!-- Cart items -->

    <div
      class="drawer-items"
      id="drawerItems"
    ></div>


    <!-- Footer -->

    <div
      class="drawer-footer"
      id="drawerFooter"
    ></div>

  </aside>


  <!-- ==========================================================
       TOAST
       ========================================================== -->

  <div
    class="toast-container"
    id="toastContainer"
    aria-live="polite"
    aria-atomic="true"
  ></div>


  <!-- ==========================================================
       BACK TO TOP
       ========================================================== -->

  <button
    id="backToTop"
    class="back-to-top"
    type="button"
    onclick="scrollToTop()"
    aria-label="Back to top"
    title="Back to top"
  >

    <svg
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <polyline
        points="18 15 12 9 6 15"
      ></polyline>
    </svg>

  </button>


  <!-- ==========================================================
       DATA + APPLICATION
       ========================================================== -->

  <script src="Assets/data/menu.js"></script>
  <script src="Assets/js/script.js"></script>

</body>
</html>
